# /etc/nginx/sites-available/knowledge-forge.dev.conf   (DEVELOPMENT)
#
# Plain HTTP, no ACME, no HSTS. The application still sets its own security headers; HSTS is skipped
# automatically because the request is not HTTPS.
#
#   echo "127.0.0.1  knowledge-forge.local" | sudo tee -a /etc/hosts
#   sudo ln -s /etc/nginx/sites-available/knowledge-forge.dev.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name knowledge-forge.local;
    root /var/www/html/knowledge-forge/public;
    index index.php;
    charset utf-8;
    client_max_body_size 32m;

    location / { try_files $uri $uri/ /index.php$is_args$args; }

    location ~ ^/index\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120s;      # generous for xdebug / manual worker runs
    }

    location ~ \.php$ { return 404; }
    location ^~ /assets/ { expires 1h; access_log off; try_files $uri =404; }
    location ~ /\.(?!well-known).* { deny all; }
}
