# /etc/nginx/sites-available/knowledge-forge.conf   (PRODUCTION)
#
# Placeholders: KF_HOSTNAME = the real FQDN, e.g. knowledge.example.com
#
# Bootstrap order:
#   1. Install ONLY the port-80 server block below.
#   2. sudo certbot certonly --webroot -w /var/www/certbot -d KF_HOSTNAME
#   3. Uncomment the 443 block, `sudo nginx -t`, then reload.
#
# Security response headers (CSP, X-Frame-Options, nosniff, Referrer-Policy, Permissions-Policy, and
# HSTS on HTTPS) are set by the application itself (SecurityHeadersMiddleware), so they are correct
# behind any front end and are intentionally NOT duplicated here.

server {
    listen 80;
    listen [::]:80;
    server_name KF_HOSTNAME;

    # ACME must stay reachable over plain HTTP and be matched before the dotfile-deny rule. "^~" beats
    # regex locations, so this always wins.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.18 on this host: http2 goes on the listen directive.
    # On nginx >= 1.25.1 use "listen 443 ssl;" plus a separate "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name KF_HOSTNAME;

    ssl_certificate     /etc/letsencrypt/live/KF_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/KF_HOSTNAME/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;   # written by certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Document root is public/ ONLY. runtime/storage, src, config, vendor and .env live outside this
    # tree and are unreachable over HTTP.
    root /var/www/html/knowledge-forge/public;
    index index.php;

    charset utf-8;
    # 32m serves single-file uploads. Audio-to-Text separate (Customer + Agent) uploads send two
    # files in one request and need 64m here AND post_max_size = 64M in the FPM php.ini — the FPM
    # ini, not the CLI one, which reports a different number and never answers a request.
    client_max_body_size 32m;          # >= MAX_UPLOAD_SIZE_MB, <= PHP-FPM post_max_size (40M)

    access_log /var/log/nginx/knowledge-forge.access.log;
    error_log  /var/log/nginx/knowledge-forge.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ ^/index\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;

        # Ingestion runs in the cron worker. The ONLY synchronous OpenAI call from this tier is chat
        # (OPENAI_CHAT_TIMEOUT_SECONDS=45, one retry), so 90s is a deliberate ceiling above that budget.
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout    90s;
        fastcgi_read_timeout    90s;
        fastcgi_buffers         16 16k;
        fastcgi_buffer_size     32k;
    }

    location ~ \.php$ { return 404; }          # nothing else reaches PHP-FPM

    location ^~ /assets/ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Deny dotfiles but never /.well-known (belt and braces with the ^~ blocks above).
    location ~ /\.(?!well-known).* { deny all; }
}
